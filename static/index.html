<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notera</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@500;600;700&family=Newsreader:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Fira+Code:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--bg:#fff;--bg3:#f4f4f2;--y:#2563eb;--yd:#1d4ed8;--ln:rgba(0,0,0,.09);--tx:#1f1f1d;--mut:#8a8a85;--ac:#2563eb;--kw:#c026d3;--st:#15803d;--nm:#1d4ed8;--cm:#9a9a94;--bi:#b45309;--ok:#15803d;--er:#dc2626;
--codebg:#f7f7f5;--codetx:#1f1f1d;--panel:#fff;--panel2:#fafaf8;--veil1:rgba(0,0,0,.035);--veil2:rgba(0,0,0,.06);--inktx:#fff;
--c2:var(--tx);--c3:var(--tx);--c4:var(--tx);--c5:var(--mut);--c6:var(--mut);
--r:10px;--rs:6px;--rl:14px;--ease:cubic-bezier(.32,.72,0,1);--sw:268px;
--ui:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.65 var(--ui);height:100vh;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--y) 28%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--ln);border:3px solid transparent;background-clip:content-box;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box;border:3px solid transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid color-mix(in srgb,var(--y) 55%,transparent);outline-offset:2px}
@keyframes ntFadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes ntFadeIn{from{opacity:0}to{opacity:1}}
@keyframes ntPulse{0%,100%{opacity:1}50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
code,textarea.cd,pre,.mono{font:13px/1.65 var(--mono)}

/* sidebar: the shell animates width only; the inner column keeps a fixed width so text never re-wraps mid-slide */
#side{width:var(--sw);flex-shrink:0;height:100vh;background:var(--panel2);border-right:1px solid var(--ln);overflow:hidden;transition:width .3s var(--ease),border-color .3s var(--ease);will-change:width;contain:layout paint}
#side .sin{width:var(--sw);height:100%;display:flex;flex-direction:column;min-height:0;transition:transform .3s var(--ease),opacity .22s ease;will-change:transform}
#side.collapsed{width:0;border-right-color:transparent}
#side.collapsed .sin{transform:translateX(-24px);opacity:0;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 8px 18px}
.mark{width:22px;height:22px;background:var(--tx);border-radius:6px;color:var(--bg);display:flex;align-items:center;justify-content:center;font:700 12px var(--ui);flex-shrink:0}
.brand h1{font-size:14.5px;line-height:1;letter-spacing:-.1px;font-weight:600}
#sctb{flex-shrink:0;width:26px;height:26px;border-radius:var(--rs);color:var(--mut);display:flex;align-items:center;justify-content:center;margin-left:auto;transition:background-color .15s,color .15s}
#sctb svg{width:14px;height:14px}
#sctb:hover{background:var(--veil2);color:var(--tx)}
#side .top{padding:6px 12px 8px;display:flex;flex-direction:column;gap:8px}
#side input{background:var(--veil1);border:1px solid transparent;border-radius:var(--rs);padding:7px 10px;outline:0;width:100%;font:400 13px var(--ui);transition:border-color .15s,background-color .15s}
#side input:focus{border-color:var(--ln);background:var(--panel)}
#side input::placeholder{color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tg{font:500 11.5px var(--ui);border-radius:999px;padding:1px 9px;color:var(--mut);background:var(--veil1);cursor:pointer;transition:background-color .15s,color .15s}
.tg:hover{background:var(--veil2);color:var(--tx)}
.tg.on{background:color-mix(in srgb,var(--y) 14%,transparent);color:var(--y)}
#tree{flex:1;overflow:auto;padding:4px 8px 8px}
.sec{font:600 11px var(--ui);letter-spacing:.3px;color:var(--mut);padding:12px 10px 4px}
.pg{display:flex;align-items:center;gap:2px;padding:5px 8px;border-radius:var(--rs);cursor:pointer;white-space:nowrap;font-weight:450;font-size:13.5px;color:color-mix(in srgb,var(--tx) 82%,transparent);margin-bottom:1px;transition:background-color .12s,color .12s}
.pg:hover{background:var(--veil1)}
.pg.on{background:var(--veil2);color:var(--tx);font-weight:550}
.pg .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.pg .ar{width:16px;text-align:center;font-size:10px;color:var(--mut)}
.pg .ac{display:none;gap:1px}.pg:hover .ac,.pg.on .ac{display:flex}
.pg .ac button{padding:3px;border-radius:5px;display:flex;align-items:center;color:var(--mut)}.pg .ac button:hover{color:var(--tx);background:var(--veil2)}
.pg .ac button svg{fill:none}.pg .ac button.on svg{fill:currentColor}
#sv{cursor:pointer;display:flex;align-items:center;gap:6px;font:500 11px var(--ui);color:var(--mut);padding:6px 18px}
#sv::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0;transition:background-color .2s}
#sv.err::before{background:var(--er)}#sv.err{color:var(--er)}
.btns{padding:8px 12px 14px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.btns .b{justify-content:center;padding:7px 0}
.btns .b .lbl{display:none}
.btns .master,.btns #np{grid-column:span 3}
.btns .master .lbl,.btns #np .lbl{display:inline}
.btns .master{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btns .master:hover{background:color-mix(in srgb,var(--tx) 88%,var(--bg))}
.btns #np{color:var(--tx)}
.btns .b+.b{margin:0}
.b{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--ui);border:1px solid var(--ln);border-radius:var(--rs);padding:5px 10px;background:transparent;color:var(--mut);transition:background-color .15s,color .15s,border-color .15s}
.b svg{width:14px;height:14px;flex-shrink:0}
.b:hover{background:var(--veil1);color:var(--tx)}
.b:active{background:var(--veil2)}

/* sidebar reopen button */
#sctoggle{position:fixed;top:14px;left:14px;z-index:15;width:30px;height:30px;color:var(--mut);display:flex;align-items:center;justify-content:center;border-radius:var(--rs);opacity:0;pointer-events:none;transform:translateX(-6px);transition:opacity .2s ease,transform .3s var(--ease),background-color .15s,color .15s}
body.sidecol #sctoggle{opacity:1;pointer-events:auto;transform:none;transition-delay:.12s,.12s,0s,0s}
#sctoggle svg{width:16px;height:16px}
#sctoggle:hover{background:var(--veil2);color:var(--tx)}

/* editor */
#main{flex:1;overflow:auto;min-width:0}
#ed{width:100%;max-width:780px;margin:0 auto;padding:72px 48px 180px}
#ted{display:flex;gap:12px;align-items:center;margin-bottom:6px}#ted #ti{flex:1}
#ti{width:100%;background:none;border:0;outline:0;font:700 36px/1.25 var(--ui);letter-spacing:-.6px;padding:2px 0;color:var(--tx)}
#ti::placeholder{color:color-mix(in srgb,var(--mut) 55%,transparent)}
.ico{font-size:26px;width:44px;height:44px;border-radius:var(--rs);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--mut);transition:background-color .15s}.ico:hover{background:var(--veil2)}
#tr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;align-items:center;min-height:26px}
#tr input{background:none;border:0;border-radius:999px;padding:1px 6px;font:400 12.5px var(--ui);width:90px;outline:0;color:var(--mut)}
#tr input:focus{color:var(--tx)}
#tr .tg{background:var(--veil1);color:var(--mut)}
#tr .tg:hover{background:var(--veil2);color:var(--tx)}
.blk{position:relative;display:flex;align-items:flex-start;margin:2px 0;border-radius:6px;width:100%}
.bd{flex:1;min-width:0}
.tl{position:absolute;right:0;top:-30px;display:flex;background:var(--panel);border:1px solid var(--ln);border-radius:var(--rs);box-shadow:0 6px 20px -6px rgba(0,0,0,.18);z-index:2;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s;overflow:hidden}
body.ctrlkey .blk:hover>.tl{opacity:1;visibility:visible;pointer-events:auto}
.tl button{padding:0 7px;color:var(--mut);height:28px;display:flex;align-items:center}.tl button:hover,.tl button.on{background:var(--veil2);color:var(--tx)}
.tl svg{width:13px;height:13px}
.ce{outline:0;min-height:1.65em;padding:2px 0;margin:0;word-break:break-word;border-radius:4px}
.ce:empty:before{content:attr(data-ph);color:color-mix(in srgb,var(--mut) 60%,transparent);pointer-events:none}
.blk:not(:hover) .ce:empty:not(:focus):before{opacity:0}
.ce a{color:var(--y);text-decoration:underline;text-underline-offset:2px}
.h1{font-size:28px;font-weight:700;letter-spacing:-.4px;line-height:1.3;margin-top:14px}.h2{font-size:22px;font-weight:650;letter-spacing:-.3px;line-height:1.3;margin-top:10px}.h3{font-size:17.5px;font-weight:600;line-height:1.35;margin-top:6px}
.quote{border-left:2px solid var(--tx);padding-left:14px;color:color-mix(in srgb,var(--tx) 78%,transparent)}
.callout{background:var(--veil1);border-radius:var(--r);padding:12px 14px;display:flex;gap:11px;margin:6px 0;width:100%}
.callout svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}
.mk{width:18px;flex-shrink:0;color:var(--mut);user-select:none;text-align:center;cursor:pointer}
.row{display:flex;gap:8px;align-items:flex-start}
.row input[type=checkbox]{accent-color:var(--y);width:16px;height:16px;margin-top:6px}
.done .ce{text-decoration:line-through;color:var(--mut)}
hr{border:0;border-top:1px solid var(--ln);margin:18px 0;width:100%}
.tgb{margin-left:26px;border-left:1px solid var(--ln);padding-left:14px}

/* images: compact by default, three presets, flows into a tidy row when several are small */
#bl{display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:14px}
.blk.imgb{width:auto;max-width:100%;margin:6px 0}
.blk.imgb.full{width:100%}
.blk.imgb .bd{flex:none;max-width:100%}
.imgf{position:relative;display:inline-flex;flex-direction:column;gap:6px;max-width:100%;vertical-align:top}
.imgf[data-s="s"]{width:200px}.imgf[data-s="m"]{width:420px}.imgf[data-s="l"]{width:100%}
.imgf .im{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--ln);background:var(--veil1);line-height:0;cursor:zoom-in;transition:border-color .15s,box-shadow .2s}
.imgf .im:hover{border-color:color-mix(in srgb,var(--tx) 22%,transparent);box-shadow:0 6px 20px -10px rgba(0,0,0,.25)}
.imgf img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain}
.szc{position:absolute;top:8px;right:8px;display:flex;gap:1px;padding:2px;border-radius:8px;background:rgba(20,20,20,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .2s var(--ease);line-height:1}
.imgf:hover .szc,.szc:focus-within{opacity:1;transform:none}
.szc button{font:600 11px var(--ui);width:24px;height:22px;border-radius:6px;color:rgba(255,255,255,.7);transition:background-color .12s,color .12s}
.szc button:hover{color:#fff}
.szc button.on{background:rgba(255,255,255,.95);color:#111}
.cap{font-size:12.5px;color:var(--mut);padding:0 2px;line-height:1.5}
.cap:empty{display:none}
.imgf:hover .cap:empty,.cap:empty:focus{display:block}
.imgempty{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13.5px;border:1px dashed var(--ln);border-radius:var(--r);padding:12px 14px}
.imgempty a{color:var(--tx);text-decoration:underline;text-underline-offset:2px}
#lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;cursor:zoom-out}
#lb.show{opacity:1;visibility:visible}
#lb img{max-width:92vw;max-height:90vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.97);transition:transform .25s var(--ease)}
#lb.show img{transform:none}

/* code */
.code{background:var(--codebg);border:1px solid var(--ln);border-radius:var(--r);margin:8px 0;overflow:hidden;width:100%}
.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 5px 14px;font:500 11.5px var(--mono);color:var(--mut);border-bottom:1px solid var(--ln)}
.ch .b{padding:2px 8px;font-size:12px}
.ch .run{color:var(--tx)}
.cw{position:relative}
.cw pre,.cw textarea{margin:0;padding:12px 14px;white-space:pre;overflow:auto;border:0;width:100%;min-height:60px;tab-size:4}
.cw pre{position:absolute;inset:0;pointer-events:none;color:var(--codetx);overflow:hidden}
.cw textarea{position:relative;background:none;color:transparent;caret-color:var(--tx);outline:0;resize:none;display:block;overflow:hidden}
.out{border-top:1px solid var(--ln);padding:10px 14px;white-space:pre-wrap;color:var(--ok);max-height:300px;overflow:auto;font:13px/1.55 var(--mono);animation:ntFadeIn .18s ease}
.out.running{animation:ntPulse 1s ease infinite}
.out.ntpopin{animation:ntFadeUp .22s ease}
.code.busy .ch .run{animation:ntPulse .9s ease infinite}
.out.er{color:var(--er)}
.k{color:var(--kw)}.s{color:var(--st)}.n{color:var(--nm)}.c{color:var(--cm)}.f{color:var(--bi)}
.ce code{background:var(--veil2);color:inherit;padding:1px 5px;border-radius:4px;font:13px var(--mono)}

/* table / columns / math */
.tbl{border-collapse:separate;border-spacing:0;width:100%;border-radius:var(--rs);overflow:hidden;border:1px solid var(--ln)}.tbl td{border:0;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:7px 11px;min-width:80px;outline:0}.tbl td:last-child{border-right:0}.tbl tr:last-child td{border-bottom:0}.tbl td.th{background:var(--veil1);font-weight:600}
.tc{display:flex;gap:6px;margin-top:8px}.tc .b{padding:1px 8px;font-size:11.5px}
.cols{display:flex;gap:18px}.col{flex:1;border-left:1px solid var(--ln);padding-left:12px}
.mt{width:100%;background:var(--codebg);border:1px solid var(--ln);border-radius:var(--rs);color:var(--tx);font:13px var(--mono);padding:9px 11px;resize:none;outline:0;min-height:44px}
.mtsp{margin:6px 0;font-size:11.5px!important;padding:3px 8px!important}
.mp{text-align:center;padding:8px;overflow-x:auto}.mp .katex{color:var(--tx)}
.doc{line-height:1.65}
.doc>:first-child{margin-top:0}.doc>:last-child{margin-bottom:0}
.doc h1,.doc h2,.doc h3{margin:14px 0 6px;font-weight:650;line-height:1.3}
.doc h1{font-size:26px}.doc h2{font-size:21px}.doc h3{font-size:17px}
.doc p{margin:8px 0}
.doc ul,.doc ol{margin:6px 0;padding-left:26px}
.doc li{margin:3px 0}
.doc blockquote{border-left:2px solid var(--tx);padding-left:14px;margin:8px 0;color:var(--mut)}
.doc pre{background:var(--codebg);border:1px solid var(--ln);border-radius:var(--rs);padding:12px 14px;margin:8px 0;overflow:auto;font:13px/1.55 var(--mono);color:var(--codetx)}
.doc pre code{background:none;color:inherit;padding:0}
.doc table{border-collapse:separate;border-spacing:0;width:100%;margin:8px 0;border-radius:var(--rs);overflow:hidden;border:1px solid var(--ln)}
.doc table td,.doc table th{border:1px solid var(--ln);padding:7px 11px;text-align:left}
.doc table th{background:var(--veil1);font-weight:600}

/* add bar */
.add{display:flex;gap:6px;margin-top:36px;flex-wrap:wrap;width:100%;opacity:.5;transition:opacity .2s}
.add:hover,.add:focus-within{opacity:1}

/* popovers */
#thp,#hip{position:fixed;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 16px 48px -12px rgba(0,0,0,.28);padding:14px;z-index:30;bottom:64px;left:12px;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .16s ease,transform .22s var(--ease),visibility .16s;transform-origin:bottom left}
#thp{width:260px;max-height:82vh;overflow:auto}#hip{width:340px;max-height:72vh;overflow:auto}
#thp.show,#hip.show{opacity:1;visibility:visible;transform:none}
#thp .tlabel,#hip .tlabel{font:600 11px var(--ui);color:var(--mut)}
#thp .swgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#thp .sw{height:44px;border-radius:var(--rs);border:1px solid var(--ln);cursor:pointer;position:relative;display:flex;align-items:flex-end;padding:4px 7px;transition:box-shadow .15s}
#thp .sw:hover{box-shadow:0 0 0 2px var(--ln)}
#thp .sw.on{box-shadow:0 0 0 2px var(--y)}
#thp .sw span{font:500 11.5px var(--ui)}
#thp .sw i{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%}
#thp .acc{display:flex;align-items:center;gap:8px}
#thp input[type=color]{width:34px;height:26px;border:1px solid var(--ln);border-radius:6px;background:var(--panel);padding:2px;cursor:pointer}
#thp .fsel{width:100%;background:var(--veil1);border:1px solid var(--ln);border-radius:var(--rs);color:var(--tx);padding:6px 8px;font:400 13px var(--ui);outline:0;cursor:pointer}
#hip .hilist{overflow:auto;display:flex;flex-direction:column;gap:6px;max-height:44vh}
#hip .hirow{border:1px solid var(--ln);border-radius:var(--rs);padding:8px 10px;background:var(--veil1)}
#hip .hirow .hitime{font:600 12px var(--ui);color:var(--tx)}
#hip .hirow .himeta{font:11.5px var(--ui);color:var(--mut);margin:2px 0 7px}
#hip .hirow .hiact{display:flex;gap:6px}
#hip .hirow .hiact .b{font-size:11.5px;padding:2px 8px}
#hip .hiempty{color:var(--mut);font:13px var(--ui);padding:8px 0}
#sl{position:fixed;background:var(--panel);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 16px 48px -12px rgba(0,0,0,.28);width:240px;max-height:310px;overflow:auto;z-index:9;display:none;padding:4px}
#sl div{padding:6px 10px;cursor:pointer;font:450 13.5px var(--ui);border-radius:6px}
#sl div.on,#sl div:hover{background:var(--veil2)}
#ft{position:fixed;display:none;z-index:30;background:var(--panel);border:1px solid var(--ln);border-radius:var(--rs);box-shadow:0 12px 32px -10px rgba(0,0,0,.25);padding:3px;flex-wrap:wrap;max-width:340px;align-items:center}
#ft button{font:600 12.5px var(--ui);padding:4px 9px;border-radius:5px;color:var(--tx)}#ft button:hover{background:var(--veil2)}
#ft i{width:16px;height:16px;border-radius:5px;border:1px solid var(--ln);cursor:pointer;display:inline-block;margin:6px 3px}
#sb{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 12px 36px -10px rgba(0,0,0,.28);padding:6px 10px;display:none;gap:6px;align-items:center;z-index:25;font:500 12.5px var(--ui);color:var(--mut)}
.blk.sel{background:color-mix(in srgb,var(--y) 8%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--y) 40%,transparent)}
.trw{display:flex;gap:6px;padding:5px 8px;border-radius:var(--rs);font-size:13px;color:var(--mut)}.trw:hover{background:var(--veil1)}.trw span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trw button{color:var(--mut)}.trw button:hover{color:var(--tx)}
.pg.dz{outline:2px dashed var(--y);outline-offset:-2px}
#toast{position:fixed;bottom:24px;left:50%;background:var(--tx);color:var(--bg);font:500 13px var(--ui);padding:9px 16px;border-radius:999px;box-shadow:0 12px 32px -8px rgba(0,0,0,.35);opacity:0;transform:translate(-50%,10px);transition:opacity .2s ease,transform .3s var(--ease);pointer-events:none;z-index:60}

/* ===== Editorial pass: one hairline border everywhere, no decorative accents, larger type ===== */
:root{--r:6px;--rs:4px;--rl:8px;--serif:'Newsreader',Georgia,'Times New Roman',serif}

/* text frames */
.blk[data-t="p"] .ce,.blk[data-t="doc"] .ce{border-radius:6px;padding:9px 14px}
.blk[data-t="p"] .ce:focus,.blk[data-t="doc"] .ce:focus-within{background:none;border-color:color-mix(in srgb,var(--tx) 45%,transparent)}
/* paste prompt box */
.pbox{border:1px solid color-mix(in srgb,var(--tx) 22%,transparent);border-radius:8px;background:var(--bg);box-shadow:none}

/* ===== Premium pass: DM Sans + Fraunces, Notion-style colour, roomy sidebar ===== */

.pnet{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:transparent}.pnet.on{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}.pnet.wait{background:var(--yellow)}

#side.collapsed.peek .sin{transform:none;opacity:1;pointer-events:auto}
/* headings: Fraunces with a hint of colour */
#ti{font:600 46px/1.12 var(--serif);letter-spacing:-.9px;font-variation-settings:'SOFT' 100,'opsz' 96}

/* ---------- array visual: value over index, click to highlight, double-click to edit, right-click to negate ---------- */
function arrHtml(vals,hi){return'<div class="arrv" contenteditable="false" title="Click to highlight. Double-click to edit. Right-click to make it negative.">'+vals.map((v,i)=>'<span class="ac'+(hi&&hi.includes(i)?' hi':'')+'"><b>'+esc(v)+'</b><i>'+i+'</i></span>').join('')+'</div>'}
/* turns "2,0,3,1,1,2..." (value, index, value, index) runs left behind by copied array widgets back into a real array visual */
function arrayize(html){
 const mk=toks=>{if(toks.length<8||toks.length%2)return null;const vals=[];for(let k=0;k<toks.length;k+=2){if(!/^\d+$/.test(toks[k+1])||+toks[k+1]!==k/2)return null;vals.push(toks[k])}return arrHtml(vals)};
 html=html.replace(/<p>([\s\S]*?)<\/p>/g,(m,inner)=>{const L=inner.split('<br>');if(L.length<8)return m;
  const tok=x=>/^[^<\s]{1,6}$/.test(x.trim());let out='',txt=[],i=0,hit=false;
  const flush=()=>{if(txt.length){out+='<p>'+txt.join('<br>')+'</p>';txt=[]}};
  while(i<L.length){if(tok(L[i])){let j=i;while(j<L.length&&tok(L[j]))j++;const run=L.slice(i,j).map(x=>x.trim());let n=0;while(2*n+1<run.length&&run[2*n+1]===String(n))n++;
    if(n>=4){flush();out+=arrHtml(run.filter((x,k)=>k<2*n&&k%2===0));hit=true;i+=2*n;continue}}
   txt.push(L[i]);i++}
  flush();return hit?out:m});
 /* a run of short blocks of ANY kind (paragraph, quote, heading, "value<br>index" cells) that alternates value, 0, value, 1, ... */
 html=html.replace(/(?:<(?:p|blockquote|h[1-6])>(?:<\/?(?:b|i|strong|em|code)>|[^<\s]{1,6}|<br>)+<\/(?:p|blockquote|h[1-6])>)+/g,run=>{
  const items=[...run.matchAll(/<(p|blockquote|h[1-6])>(.*?)<\/\1>/g)].map(m=>({raw:m[0],tk:m[2].split('<br>').map(x=>x.replace(/<[^>]+>/g,'').trim()).filter(Boolean)}));
  const flat=items.flatMap(it=>it.tk);let n=0;while(2*n+1<flat.length&&flat[2*n+1]===String(n))n++;
  if(n<4)return run;
  let used=0,k=0;while(k<items.length&&used<2*n){used+=items[k].tk.length;k++}
  if(used!==2*n)return run;
  return arrHtml(flat.filter((x,i)=>i<2*n&&i%2===0))+items.slice(k).map(it=>it.raw).join('')});

/* code that arrives squashed onto one line (indent runs and "]print" joins) gets its line breaks back */
function fixFlatCode(c){if(/\n/.test(c)||c.length<25)return c;
 return c.replace(/([\])}'"])(?=[A-Za-z_])/g,'$1\n').replace(/(?<=\S) {2,}(?=\S)/g,m=>'\n'+m)}

/* ---------- more rebuilt widgets: flow rows, numbered step cards, quizzes ---------- */
const INL='(?:<\\/?(?:b|i|strong|em|code)>|[^<])';
const BLKS=['p','blockquote','h1','h2','h3'];
const shortRuns=max=>new RegExp('(?:'+BLKS.map(t=>'<'+t+'>'+INL+'{1,'+max+'}<\\/'+t+'>').join('|')+')+','g');
const blkItems=run=>[...run.matchAll(/<(p|blockquote|h[1-6])>(.*?)<\/\1>/g)].map(m=>({raw:m[0],text:m[2].replace(/<[^>]+>/g,'').trim()}));
const LBL=/^([A-Za-z][\w ]{0,14}):\s*(\S.{0,22})$/;
function flowize(html){
 return html.replace(shortRuns(40),run=>{
  const items=blkItems(run).map(it=>({...it,tk:it.text.split(/\s*(?:→|->|⟶)\s*/).map(x=>x.trim()).filter(Boolean)}));
  for(let st=0;st<items.length;st++){
   const sub=items.slice(st),flat=sub.flatMap(it=>it.tk);if(flat.length<6)break;
   const a=LBL.exec(flat[0]),b=LBL.exec(flat[1]);if(!a||!b||a[1]===b[1])continue;
   let n=0;while(2*n+1<flat.length){const x=LBL.exec(flat[2*n]),y=LBL.exec(flat[2*n+1]);if(!x||!y||x[1]!==a[1]||y[1]!==b[1])break;n++}
   if(n<3)continue;
   let used=0,k=0;while(k<sub.length&&used<2*n){used+=sub[k].tk.length;k++}
   if(used!==2*n)continue;
   let rows='';for(let i=0;i<n;i++)rows+='<div class="fr"><span class="fc">'+esc(flat[2*i])+'</span><span class="fa" contenteditable="false">→</span><span class="fc v">'+esc(flat[2*i+1])+'</span></div>';
   return items.slice(0,st).map(it=>it.raw).join('')+'<div class="flowv">'+rows+'</div>'+sub.slice(k).map(it=>it.raw).join('')}
  return run})}
function stepize(html){

function quizize(html){

/* ---------- template customisation: which templates show, and which sections each contains ---------- */
const TPL_FULL={};Object.keys(TPL).forEach(k=>{TPL_FULL[k]=TPL[k].make});
const tplCfg=()=>{S.settings=S.settings||{};return S.settings.tpl=S.settings.tpl||{hidden:[],skip:{}}};
const tplSections=k=>{const o=[];TPL_FULL[k]().forEach(b=>{if(b.t==='h2'&&!o.includes(b.h))o.push(b.h)});return o};
Object.keys(TPL).forEach(k=>{TPL[k].make=()=>{const skip=new Set((tplCfg().skip||{})[k]||[]);if(!skip.size)return TPL_FULL[k]();let drop=false;return TPL_FULL[k]().filter(b=>{if(b.t==='h2')drop=skip.has(b.h);return !drop})}});
const tplVisible=()=>Object.entries(TPL).filter(([k])=>!(tplCfg().hidden||[]).includes(k));
function openTplSettings(){const w=$('#tset');const open=new Set();
 const draw=()=>{const c=tplCfg();w.innerHTML=`<div class="icbox"><div class="ich"><b>Customize templates</b><button id="tsx">${ic('close',16)}</button></div><div class="icb tsl"><p>Tick the templates you want in the New menu. Open a template to choose which sections a new page gets. Pages you already made are never changed.</p>
  ${Object.entries(TPL).map(([k,t])=>{const secs=tplSections(k),sk=(c.skip||{})[k]||[],on=!(c.hidden||[]).includes(k);return`<div class="tsr${on?'':' off'}"><label class="tsh"><input type="checkbox" data-k="${k}" ${on?'checked':''}><span class="tpc" style="--pc:${t.color}">${ic(t.icon,15)}</span><span><b>${esc(t.label)}</b><i>${esc(t.desc)}</i></span></label>${secs.length?`<button class="tsx" data-o="${k}" title="Choose sections">${secs.length-sk.length}/${secs.length} sections ${ic('chev',11)}</button>`:''}
  ${open.has(k)?`<div class="tss">${secs.map(s=>`<label><input type="checkbox" data-k="${k}" data-s="${esc(s).replace(/"/g,'&quot;')}" ${sk.includes(s)?'':'checked'}>${esc(s)}</label>`).join('')}</div>`:''}</div>`}).join('')}
  <div class="aiact"><button id="tsr">Reset to defaults</button><button class="pri" id="tsd">Done</button></div></div></div>`;
  w.querySelector('#tsx').onclick=w.querySelector('#tsd').onclick=close;
  w.querySelector('#tsr').onclick=()=>{S.settings.tpl={hidden:[],skip:{}};save();draw()};
  w.querySelectorAll('.tsx').forEach(b=>b.onclick=()=>{open.has(b.dataset.o)?open.delete(b.dataset.o):open.add(b.dataset.o);draw()});
  w.querySelectorAll('input[type=checkbox]').forEach(i=>i.onchange=()=>{const c=tplCfg(),k=i.dataset.k;c.skip=c.skip||{};c.hidden=c.hidden||[];
   if(i.dataset.s!==undefined){const a=c.skip[k]=c.skip[k]||[];const s=i.dataset.s;if(i.checked){c.skip[k]=a.filter(x=>x!==s)}else if(!a.includes(s))a.push(s)}
   else{i.checked?c.hidden=c.hidden.filter(x=>x!==k):c.hidden.includes(k)||c.hidden.push(k)}
   save();draw()})};
 const close=()=>w.classList.remove('show');w.onmousedown=e=>{if(e.target===w)close()};draw();w.classList.add('show')}

const pvTxt=(h,n)=>{const t=stripH(h);return esc(t.length>n?t.slice(0,n)+'...':t)};
function pagePreview(p){if(p.folder){const k=kids(p.id).sort((a,b)=>(!!b.folder-!!a.folder)||byTitle(a,b));return`<div class="pvt">${esc(p.title||'Untitled folder')}</div><div class="pvm">${k.length} item${k.length===1?'':'s'}</div>${k.slice(0,12).map(c=>`<div class="pvk">${c.folder?ic('folder',13):ic('doc',13)}<span>${esc(c.title||'Untitled')}</span></div>`).join('')||'<div class="pvm">Empty folder</div>'}${k.length>12?`<div class="pvm">and ${k.length-12} more</div>`:''}`}
 let out='',shown=0;for(const b of p.blocks){if(shown>=14)break;const t=b.t;let x='';
  if(t==='h1'||t==='h2'||t==='h3')x=`<div class="pvh ${t}">${pvTxt(b.h,90)}</div>`;
  else if(t==='ul'||t==='ol'||t==='todo')x=stripH(b.h)?`<div class="pvl">${t==='todo'?(b.done?'\u2611 ':'\u2610 '):'\u2022 '}${pvTxt(b.h,110)}</div>`:'';
  else if(t==='code'){const c=(b.h||'').split('\n').slice(0,6).join('\n');x=c.trim()?`<pre class="pvc">${esc(c)}</pre>`:''}
  else if(t==='image'&&/^(data:image|https?:)/i.test(b.src||''))x=`<img class="pvi" src="${esc(b.src).replace(/"/g,'&quot;')}" alt="">`;
  else if(t==='svg')x='<div class="pvm">Diagram</div>';
  else if(t==='lc')x=`<div class="pvb">${ic('code',13)}${esc((b.num?b.num+'. ':'')+(b.title||p.title||'Problem'))} \u00b7 ${esc(b.diff||'')} \u00b7 ${esc(b.status||'')}</div>`;
  else if(t==='qa')x=stripH(b.h)?`<div class="pvl"><b>Q</b> ${pvTxt(b.h,90)}</div>`:'';
  else if(t==='table'&&b.rows&&b.rows[0])x=`<div class="pvm">Table: ${esc(b.rows[0].map(c=>stripH(c)).join(' | ').slice(0,80))}</div>`;
  else if(t==='html'||t==='component')x='<div class="pvm">Interactive component</div>';
  else if(t==='hr'||t==='cols')x='';
  else x=stripH(b.h)||stripH(b.body)?`<div class="pvp">${pvTxt(b.h||b.body,t==='doc'?420:200)}</div>`:'';
  if(x){out+=x;shown++}}
 return`<div class="pvt">${esc(p.title||'Untitled')}</div><div class="pvm">${p.mode==='canvas'?'Canvas \u00b7 ':''}${p.blocks.length} blocks${p.tags&&p.tags.length?' \u00b7 '+p.tags.slice(0,4).map(esc).join(', '):''}</div>${out||'<div class="pvm">This page is empty.</div>'}`}

 const draw=()=>{
  if(step===1)w.innerHTML=`<div class="wbox"><div class="wmark">N</div><h1>Welcome to Notera</h1><p>A calm place for your notes, code and LeetCode work. First, who are you?</p><div class="wrow">${avHtml(ME,54)}<input id="wname" value="${esc(ME.name)}" maxlength="40" placeholder="Your name"></div><div class="acols wcols">${NCOL.map(c=>`<button class="acol${c===ME.color?' on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div><button class="abtn pri wgo" id="wnext">Continue</button></div>`;
  else if(step===2)w.innerHTML=`<div class="wbox wide"><h1>How do you want to start?</h1><p>You can change this later. Your user id is <code>${esc(ME.id)}</code>.</p><div class="wcards"><button class="wc" data-k="new" style="--pc:var(--blue)"><span class="wci">${ic('plus',22)}</span><b>Start fresh</b><i>A clean notebook with a starter page</i></button><button class="wc" data-k="fetch" style="--pc:var(--green)"><span class="wci">${ic('download',22)}</span><b>Fetch my notes</b><i>Pull them from your private GitHub repo</i></button><button class="wc" data-k="join" style="--pc:var(--purple)"><span class="wci">${ic('users',22)}</span><b>Join a friend</b><i>Enter their 6-digit share key</i></button><button class="wc" data-k="share" style="--pc:var(--orange)"><span class="wci">${ic('upload',22)}</span><b>Share my notes</b><i>Create a 6-digit key for a friend</i></button></div></div>`;
  else if(step==='fetch')w.innerHTML=`<div class="wbox"><button class="wback" id="wb">Back</button><h1>Fetch my notes</h1><p>Paste the address of your <b>private</b> notes repo, for example <code>https://github.com/you/notera-notes.git</code>. GitHub may ask you to sign in.${info.git?'':' <b>Git is not installed on this computer</b>, so install it from git-scm.com first.'}</p><input id="wrepo" placeholder="https://github.com/you/notera-notes.git" value="${esc(info.remote||'')}" spellcheck="false"><div class="aerr" id="werr"></div><button class="abtn pri wgo" id="wdo">Fetch notes</button></div>`;
  else if(step==='join')w.innerHTML=`<div class="wbox"><button class="wback" id="wb">Back</button><h1>Join a friend</h1><p>Ask your friend for their <b>relay address</b> (if you are not on a shared relay yet) and their 6-digit key.</p><input id="wrelay" placeholder="Relay address, e.g. http://192.168.1.20:5252" value="${esc(NET.relay||'')}" spellcheck="false"><input id="wkey" class="wkey" inputmode="numeric" maxlength="6" placeholder="000000"><div class="aerr" id="werr"></div><button class="abtn pri wgo" id="wdo">Join</button></div>`;
  const g=id=>w.querySelector('#'+id),err=t=>{const e=g('werr');if(e)e.textContent=t||''};
  if(g('wnext')){w.querySelectorAll('.acol').forEach(b=>b.onclick=async()=>{w.querySelectorAll('.acol').forEach(x=>x.classList.remove('on'));b.classList.add('on');const r=await netPost('/api/me',{color:b.dataset.c});if(r.ok){ME=r.d;renderProfile()}});
   g('wnext').onclick=async()=>{const r=await netPost('/api/me',{name:g('wname').value});if(r.ok){ME=r.d;renderProfile()}step=2;draw()};g('wname').onkeydown=e=>{if(e.key==='Enter')g('wnext').click()}}
  w.querySelectorAll('.wc').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='new')done();else if(k==='share')done('share');else{step=k;draw()}});
  if(g('wb'))g('wb').onclick=()=>{step=2;draw()};
  if(step==='fetch'&&g('wdo'))g('wdo').onclick=async()=>{err('');const u=g('wrepo').value.trim();if(!u)return err('Paste your notes repo address');g('wdo').disabled=true;g('wdo').textContent='Fetching... (sign in to GitHub if a window opens)';
   const r=await netPost('/api/sync/config',{remote:u});g('wdo').disabled=false;g('wdo').textContent='Fetch notes';
   if(!r.ok||r.d.status!=='synced')return err(r.d.msg||r.d.error||'Could not fetch. Check the address and that you are signed in to GitHub.');
   const st=await (await fetch('/api/state')).json();adopt(st);homeOn=false;toast('Your notes are here');done()};
  if(step==='join'){g('wkey').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)};
   g('wdo').onclick=async()=>{err('');const rl=g('wrelay').value.trim(),k=g('wkey').value.trim();if(!rl)return err('Enter the relay address your friend gave you');if(k.length!==6)return err('Enter the 6 digits');
    await netPost('/api/net/relay',{relay:rl});g('wdo').disabled=true;const r=await netPost('/api/net/join',{key:k});g('wdo').disabled=false;if(!r.ok)return err(r.d.error);toast('Connected. You are now sharing a space');done()}}};
 draw();w.classList.add('show')}

async function loadMe(){try{ME=await (await fetch('/api/me')).json();renderProfile();await refreshNet();setInterval(refreshNet,5000);maybeWelcome()}catch(e){}}
async function boot(){try{const r=await fetch('/api/state');if(r.ok){adopt(await r.json())}setSaveStatus('Saved')}catch(e){setSaveStatus('Could not load from server',true)}
 /* a refresh returns to the same page; a fresh launch opens Home */
 let sv=null;try{sv=JSON.parse(sessionStorage.getItem('nt.view')||'null')}catch(e){}
 if(sv&&sv.c&&P(sv.c)){cur=sv.c;if(sv.h){homeOn=true;homeMode=sv.m==='lib'?'lib':'home';homeCur=cur}}else if(!(S.pages.length<=1&&!S.pages[0].title&&S.pages[0].blocks.length<=1)){homeOn=true;homeMode='home';homeCur=cur}
 render();restoreScroll(sv);loadMe();poll();setInterval(poll,4000);
 $('#sv').onclick=async()=>{const e=$('#sv');e.textContent='Syncing…';try{syncInfo=await (await fetch('/api/sync/now',{method:'POST'})).json()}catch(x){}
  if(syncInfo.status==='off'){const u=prompt('Paste your PRIVATE notes repo URL to sync between laptops (https://github.com/you/notera-notes.git)');if(u){try{syncInfo=await (await fetch('/api/sync/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({remote:u})})).json()}catch(x){}}}
  showSync();toast(SYNC_TXT[syncInfo.status]||'Saved');poll()}}
boot();
/* heartbeat autosave: re-persists every 30s regardless of edits, so the server's
   30s-throttled backup rotation always has a fresh copy to roll even on a quiet page */
setInterval(()=>{if(dirty)save(1)},30000);
</script></body></html>
